[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipchain"
version = "0.1.0"
description = "ChipChain V3-R0-A case-first contracts and offline workflow skeleton"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "langchain>=1.2,<1.3",
    "langgraph>=1.0,<1.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
