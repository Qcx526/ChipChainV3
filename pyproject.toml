[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipchain"
version = "0.1.0"
description = "Evidence-driven Type-II firmware–hardware cross-layer analysis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyelftools>=0.33,<1",
]

[project.scripts]
chipchain = "chipchain.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
